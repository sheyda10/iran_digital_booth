    font-family:inherit;
    font-weight:700;font-size:14.5px;
    color:#0a1633;

const toastText = toast.textContent;
const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;

/* ============================================================
   کپی کردن پرامپت + نمایش پیام
   ============================================================ */
let toastTimer = null;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
}

async function copyText(text){
  try{
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){ /* fallthrough */ }

  // fallback برای مرورگرهای قدیمی / غیر HTTPS
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){
    return false;
  }
}

grid.addEventListener('click', async (e) => {
  const btn = e.target.closest('.btn');
  if(!btn) return;

  const idx = Number(btn.dataset.index);
  const prompt = PROMPTS[idx];
  if(!prompt) return;

  const ok = await copyText(prompt.text);

  if(ok){
    const label = btn.querySelector('span');
    const original = label.textContent;
    btn.classList.add('copied');
    label.textContent = 'کپی شد ✓';
    btn.querySelector('svg').outerHTML = checkIcon;
    showToast('کپی شد ✓');
    setTimeout(() => {
      btn.classList.remove('copied');
      label.textContent = 'کپی پرامپت';
      btn.querySelector('svg').outerHTML = copyIcon;
    }, 1800);
  }else{
    showToast('کپی ناموفق بود — دوباره تلاش کنید');
  }
});
